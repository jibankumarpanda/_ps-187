name: Sync ML to Hugging Face Space

on:
  push:
    branches:
      - main
      - MachineLearning
      - jiban-mldeploy
    paths:
      - 'ml/**'
  workflow_dispatch:

jobs:
  sync-to-hf:
    name: Sync ml/ to Hugging Face Docker Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub SDK
        run: |
          pip install --upgrade huggingface_hub

      - name: Auto-Create Space & Sync ml/ to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE || vars.HF_SPACE }}
        run: |
          python - << 'EOF'
          import os
          import sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              print("::error::HF_TOKEN secret is not set! Please add HF_TOKEN with 'write' permissions in GitHub Secrets.")
              sys.exit(1)

          api = HfApi(token=token)

          try:
              user_info = api.whoami()
              hf_username = user_info["name"]
              print(f"Authenticated as Hugging Face user: {hf_username}")
          except Exception as err:
              print(f"::error::Authentication failed with HF_TOKEN. Ensure the token is valid and has 'write' permissions: {err}")
              sys.exit(1)

          # Determine target space name
          raw_space = os.environ.get("HF_SPACE", "").strip()
          if not raw_space:
              target_space = f"{hf_username}/ibvap-ml"
          elif "/" in raw_space:
              target_space = raw_space
          else:
              target_space = f"{hf_username}/{raw_space}"

          print(f"Target Hugging Face Space: {target_space}")

          # Ensure the Space exists (create it automatically if not found)
          print(f"Checking/creating Hugging Face Space '{target_space}' with Docker SDK...")
          try:
              api.create_repo(
                  repo_id=target_space,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
              )
              print(f"Space '{target_space}' is ready.")
          except Exception as err:
              print(f"Notice on create_repo: {err}")

          # Upload ml directory contents to the root of the Space
          print(f"Syncing ml/ folder to Hugging Face Space '{target_space}'...")
          commit_hash = os.environ.get("GITHUB_SHA", "update")[:7]
          api.upload_folder(
              folder_path="ml",
              repo_id=target_space,
              repo_type="space",
              commit_message=f"Sync ML from GitHub [{commit_hash}]",
              ignore_patterns=[
                  "runs/**",
                  "tests/**",
                  "notebooks/**",
                  ".venv/**",
                  "venv/**",
                  "__pycache__/**",
                  "*.pyc",
                  "data/traffic-detection-project/**",
                  "data/merged-detection/**",
                  "sync-to-hf.yml",
              ],
          )

          print(f"\n=======================================================")
          print(f"SUCCESS! Deployed to: https://huggingface.co/spaces/{target_space}")
          print(f"=======================================================\n")
          EOF
